<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Automatic quota refresh proof</title></head><body><div id="proof-root"></div><script type="module">
import React from '/node_modules/.vite/deps/react.js';
import ReactDOM from '/node_modules/.vite/deps/react-dom_client.js';
import '/src/i18n/index.ts';
import '/src/styles/global.scss';

window.proof={calls:{},advance:ms=>{offset+=ms;},poll:()=>{},hold:false,release:()=>{}};

  return type==='claude'?{windows:[{id:'seven-day-fable',label:'Fable',usedPercent:15,periodHours:168,resetAtMs:Date.parse('2026-09-16T07:00:00Z')}]}:[];
 };
